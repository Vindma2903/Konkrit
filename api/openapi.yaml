openapi: 3.1.0
info:
  title: Конкрит — API платформы
  version: 0.1.0
  description: |
    Контракт для мобильного и веб-клиентов. Первая версия покрывает вход жителя,
    привязку квартиры и создание заявки. Бэкенд (Go) пока не реализован:
    мобильное приложение работает через мок, повторяющий этот контракт.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: onboarding
  - name: requests
  - name: community
  - name: staff-auth
  - name: staff-admin
paths:
  /auth/code/request:
    post:
      tags: [auth]
      summary: Отправить код входа по SMS или на почту
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRequest' }
      responses:
        '200':
          description: Код отправлен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeRequestResult' }
        '429':
          description: Слишком частые запросы; в теле — через сколько секунд повторить
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/code/verify:
    post:
      tags: [auth]
      summary: Подтвердить код и получить сессию
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeVerify' }
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400':
          description: Неверный или просроченный код (code = invalid_code)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /houses:
    get:
      tags: [onboarding]
      summary: Найти дом по адресу
      parameters:
        - name: query
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Найденные дома
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/House' }
  /me/residencies:
    get:
      tags: [onboarding]
      summary: Привязки квартир текущего жителя
      responses:
        '200':
          description: Список привязок
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Residency' }
    post:
      tags: [onboarding]
      summary: Отправить привязку квартиры на подтверждение УК
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResidencyCreate' }
      responses:
        '201':
          description: Привязка отправлена на подтверждение
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [pending] }
  /categories:
    get:
      tags: [requests]
      summary: Список категорий заявки
      responses:
        '200':
          description: Категории
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /attachments:
    post:
      tags: [requests]
      summary: Загрузить вложение заявки
      description: Файл грузится до создания заявки; в заявку передаётся идентификатор.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Файл принят
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        '413':
          description: Файл больше допустимого (фото и документы — 20 МБ, видео — 100 МБ)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Недопустимый тип файла
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /categories/suggest:
    post:
      tags: [requests]
      summary: Подсказать категорию по тексту описания
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Категория или null, если подходящей нет
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Category'
                  - type: 'null'
  /chats:
    get:
      tags: [community]
      summary: Чаты жителя — чат с УК и чаты дома, с последним сообщением и признаком непрочитанного
      responses:
        '200':
          description: Чаты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
  /chats/{id}:
    get:
      tags: [community]
      summary: Один чат
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Чат
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404':
          description: Чата нет (not_found)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /chats/{id}/messages:
    get:
      tags: [community]
      summary: Сообщения чата по порядку
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Сообщения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessage' }
    post:
      tags: [community]
      summary: Отправить сообщение или вложение в чат
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Сообщение создано (повтор с тем же clientMessageId возвращает то же)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
  /chats/{id}/read:
    post:
      tags: [community]
      summary: Отметить чат прочитанным
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Отмечено
  /news:
    get:
      tags: [community]
      summary: Новости или объявления дома, новые сверху, по страницам
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [news, announcement] } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Страница
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsPage' }
  /news/{id}:
    get:
      tags: [community]
      summary: Новость целиком
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Новость
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsDetails' }
        '404':
          description: Новости нет (not_found)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me:
    get:
      tags: [community]
      summary: Профиль жителя для вкладки «Профиль»
      responses:
        '200':
          description: Профиль (поля могут отсутствовать)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
  /requests:
    get:
      tags: [requests]
      summary: Заявки текущего жителя, новые сверху
      parameters:
        - name: status
          in: query
          description: Через запятую; без параметра — все статусы
          schema: { type: string, example: "in_progress,waiting" }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestsPage' }
    post:
      tags: [requests]
      summary: Создать заявку
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCreate' }
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestCreated' }
        '422':
          description: Ошибки валидации по полям
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /requests/{id}:
    get:
      tags: [requests]
      summary: Карточка заявки
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Заявка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetails' }
        '404':
          description: Заявки нет или она чужая
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /requests/{id}/messages:
    get:
      tags: [requests]
      summary: Переписка по заявке, по порядку
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Сообщения
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessage' }
    post:
      tags: [requests]
      summary: Отправить сообщение или вложение
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Сообщение создано (повтор с тем же clientMessageId возвращает то же)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
  /requests/{id}/history:
    get:
      tags: [requests]
      summary: История заявки, новые сверху
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HistoryEvent' }
  /requests/{id}/files:
    get:
      tags: [requests]
      summary: Файлы заявки и переписки
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Файлы
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MessageAttachment' }
  /staff/auth/login:
    post:
      tags: [staff-auth]
      summary: Вход сотрудника УК
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLogin' }
      responses:
        '200':
          description: Вход выполнен. Refresh-токен приходит в HttpOnly-куке; срок куки зависит от remember
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401':
          description: invalid_credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: pending_approval (в fields — company, adminEmail), rejected или blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: rate_limited; в теле — через сколько секунд повторить
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/auth/register:
    post:
      tags: [staff-auth]
      summary: Заявка сотрудника на доступ; подтверждает администратор УК
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffRegister' }
      responses:
        '202':
          description: Заявка принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffRegisterResult' }
        '409':
          description: email_taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: validation; в fields — сообщения по полям
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/auth/refresh:
    post:
      tags: [staff-auth]
      summary: Восстановить сессию по refresh-куке (после перезагрузки страницы)
      security: []
      responses:
        '200':
          description: Сессия восстановлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401':
          description: unauthorized — куки нет или она недействительна
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/auth/logout:
    post:
      tags: [staff-auth]
      summary: Выход сотрудника; сбрасывает refresh-куку (работает и при истёкшем access-токене)
      security: []
      responses:
        '204':
          description: Сессия закрыта
  /staff/auth/password/forgot:
    post:
      tags: [staff-auth]
      summary: Отправить ссылку для восстановления пароля
      description: Ответ одинаков для известной и неизвестной почты.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffForgot' }
      responses:
        '202':
          description: Запрос принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffForgotResult' }
        '429':
          description: rate_limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/auth/password/reset:
    post:
      tags: [staff-auth]
      summary: Задать новый пароль по ссылке из письма
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffReset' }
      responses:
        '204':
          description: Пароль изменён
        '410':
          description: invalid_token — ссылка истекла, использована или повреждена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/access-requests:
    get:
      tags: [staff-admin]
      summary: Заявки сотрудников на доступ (право staff.manage)
      parameters:
        - { name: status, in: query, required: true, schema: { type: string, enum: [pending, rejected] } }
      responses:
        '200':
          description: Заявки и число ожидающих
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequestsPage' }
        '401':
          description: unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 'forbidden: нет права staff.manage'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/access-requests/{id}/approve:
    post:
      tags: [staff-admin]
      summary: Подтвердить доступ с ролью и областью работы
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveAccess' }
      responses:
        '204':
          description: Доступ открыт; заявка стала сотрудником
        '409':
          description: 'already_processed: заявку уже обработали (в fields.status — текущее состояние)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 'validation: например, не выбран ни один дом (fields.scope)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/access-requests/{id}/reject:
    post:
      tags: [staff-admin]
      summary: Отклонить заявку на доступ
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Заявка отклонена
        '409':
          description: already_processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/members:
    get:
      tags: [staff-admin]
      summary: Сотрудники с поиском и фильтрами
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/StaffRole' } }
        - { name: houseId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/MemberStatus' } }
      responses:
        '200':
          description: Сотрудники
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffMember' }
  /staff/members/{id}:
    patch:
      tags: [staff-admin]
      summary: Изменить роль, область работы или статус сотрудника
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberPatch' }
      responses:
        '204':
          description: Изменено
        '404':
          description: not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'last_manager: нельзя отключить или понизить последнего руководителя'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 'validation: например, нельзя отключить себя (fields.status)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/roles:
    get:
      tags: [staff-admin]
      summary: Матрица прав «функция × роль»
      responses:
        '200':
          description: Права каждой роли
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolesMatrix' }
    put:
      tags: [staff-admin]
      summary: Сохранить матрицу прав; применяется ко всем сотрудникам роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matrix]
              properties:
                matrix: { $ref: '#/components/schemas/RolesMatrix' }
      responses:
        '204':
          description: Сохранено
        '422':
          description: 'validation: у руководителя нельзя снять staff.manage (fields.matrix)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /staff/houses:
    get:
      tags: [staff-admin]
      summary: Дома и участки для выбора области работы
      responses:
        '200':
          description: Дома и участки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffHouse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Channel:
      type: string
      enum: [phone, email]
    CodeRequest:
      type: object
      required: [channel, value]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        value:
          type: string
          description: Телефон в формате +7XXXXXXXXXX или адрес почты
    CodeRequestResult:
      type: object
      required: [retryAfterSec]
      properties:
        retryAfterSec: { type: integer, minimum: 0 }
    CodeVerify:
      type: object
      required: [channel, value, code]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        value: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    Session:
      type: object
      required: [accessToken, refreshToken, user, hasResidency]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/User' }
        hasResidency: { type: boolean }
    User:
      type: object
      required: [id]
      properties:
        id: { type: string }
        phone: { type: string }
        email: { type: string }
    House:
      type: object
      required: [id, title, address, company]
      properties:
        id: { type: string }
        title: { type: string }
        address: { type: string }
        company: { type: string }
    Residency:
      type: object
      required: [id, houseId, address, apartment, status, primary]
      properties:
        id: { type: string }
        houseId: { type: string }
        address: { type: string }
        apartment: { type: string }
        status: { type: string, enum: [pending, confirmed] }
        primary:
          type: boolean
          description: Основной адрес жителя, с него начинается новая заявка
    ResidencyCreate:
      type: object
      required: [houseId, apartment, role, verification]
      properties:
        houseId: { type: string }
        apartment: { type: string }
        account:
          type: string
          description: Обязателен при verification = receipt
        role: { type: string, enum: [owner, tenant] }
        verification: { type: string, enum: [receipt, document] }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    RequestCreate:
      type: object
      required: [categoryId, description, residencyId, attachmentIds, clientRequestId]
      properties:
        categoryId: { type: string }
        description: { type: string, minLength: 10, maxLength: 500 }
        residencyId: { type: string }
        attachmentIds:
          type: array
          maxItems: 10
          items: { type: string }
          description: Идентификаторы загруженных вложений
        clientRequestId:
          type: string
          description: |
            Ключ идемпотентности от клиента. Повторный запрос с тем же ключом возвращает ту же заявку,
            а не создаёт новую (ответ мог потеряться по дороге).
    RequestCreated:
      type: object
      required: [id, number, createdAt, status, answerWithinMin]
      properties:
        id: { type: string }
        number: { type: integer }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [new] }
        answerWithinMin:
          type: integer
          description: За сколько минут отвечает диспетчер
    RequestStatus:
      type: string
      enum: [new, in_progress, waiting, completed, cancelled]
    Person:
      type: object
      required: [name, position]
      properties:
        name: { type: string }
        position: { type: string }
    RequestSummary:
      type: object
      required: [id, number, title, categoryName, status, executor, createdAt]
      properties:
        id: { type: string }
        number: { type: integer }
        title:
          type: string
          description: Заголовок заявки, сервер выводит его из описания (первая фраза до 60 символов)
        categoryName: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        executor:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        createdAt: { type: string, format: date-time }
    RequestDetails:
      allOf:
        - $ref: '#/components/schemas/RequestSummary'
        - type: object
          required: [address, curator]
          properties:
            address: { type: string }
            curator:
              oneOf:
                - $ref: '#/components/schemas/Person'
                - type: 'null'
    RequestsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RequestSummary' }
        nextCursor:
          oneOf:
            - { type: string }
            - type: 'null'
    MessageAttachment:
      type: object
      required: [id, kind, name, url]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video, document] }
        name: { type: string }
        url: { type: string }
        size: { type: integer }
    ChatMessage:
      type: object
      required: [id, author, mine, createdAt]
      properties:
        id: { type: string }
        clientMessageId: { type: string }
        author:
          type: object
          required: [role]
          properties:
            role: { type: string, enum: [resident, executor, curator, dispatcher] }
            name: { type: string }
        mine: { type: boolean }
        text: { type: string }
        attachment: { $ref: '#/components/schemas/MessageAttachment' }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, kind, title, last, unread]
      properties:
        id: { type: string }
        kind: { type: string, enum: [management, house, entrance, council, neighbors] }
        title: { type: string }
        subtitle: { type: string, description: Название УК или адрес дома }
        last:
          type: [object, 'null']
          required: [authorName, text, at]
          properties:
            authorName: { type: string }
            text: { type: string }
            at: { type: string, format: date-time }
        unread: { type: boolean }
    NewsItem:
      type: object
      required: [id, kind, title, preview, date]
      properties:
        id: { type: string }
        kind: { type: string, enum: [news, announcement] }
        title: { type: string }
        preview: { type: string }
        date: { type: string, format: date-time }
        imageUrl: { type: string }
    NewsDetails:
      allOf:
        - { $ref: '#/components/schemas/NewsItem' }
        - type: object
          required: [body]
          properties:
            body: { type: array, items: { type: string }, description: Абзацы текста }
    NewsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NewsItem' } }
        nextCursor: { type: [string, 'null'] }
    Profile:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        apartment: { type: string }
    MessageCreate:
      type: object
      required: [clientMessageId]
      properties:
        clientMessageId:
          type: string
          description: Ключ идемпотентности от клиента
        text: { type: string, maxLength: 1000 }
        attachmentIds:
          type: array
          items: { type: string }
    HistoryEvent:
      type: object
      required: [id, at, text]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        text: { type: string }
    StaffLogin:
      type: object
      required: [email, password, remember]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        remember: { type: boolean }
    StaffSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user:
          type: object
          required: [id, name, role, permissions]
          properties:
            id: { type: string }
            name: { type: string }
            role: { $ref: '#/components/schemas/StaffRole' }
            permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    StaffRegister:
      type: object
      required: [name, company, email, phone, password, consent]
      properties:
        name: { type: string }
        company: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: Телефон в формате +7XXXXXXXXXX }
        password: { type: string, minLength: 8 }
        consent: { type: boolean }
    StaffRegisterResult:
      type: object
      required: [company, adminEmail]
      properties:
        company: { type: string }
        adminEmail: { type: string, format: email }
    StaffForgot:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    StaffForgotResult:
      type: object
      required: [retryAfterSec, ttlMin]
      properties:
        retryAfterSec: { type: integer, minimum: 0 }
        ttlMin: { type: integer, minimum: 1 }
    StaffReset:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 8 }
    StaffRole:
      type: string
      enum: [dispatcher, engineer, executor, manager]
      description: Диспетчер, Инженер/куратор, Исполнитель, Руководитель (администратор УК)
    Permission:
      type: string
      enum:
        - requests.create
        - requests.assign
        - requests.status
        - acts.use
        - acts.templates
        - analytics.view
        - directories.manage
        - staff.manage
        - contractors.manage
    MemberStatus:
      type: string
      enum: [active, vacation, disabled]
    StaffScope:
      type: object
      required: [all, houseIds]
      properties:
        all: { type: boolean }
        houseIds: { type: array, items: { type: string } }
    StaffHouse:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
    AccessRequest:
      type: object
      required: [id, name, email, phone, company, createdAt, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [pending, rejected] }
    AccessRequestsPage:
      type: object
      required: [items, pendingCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AccessRequest' } }
        pendingCount: { type: integer, minimum: 0 }
    ApproveAccess:
      type: object
      required: [role, scope, notify]
      properties:
        role: { $ref: '#/components/schemas/StaffRole' }
        scope: { $ref: '#/components/schemas/StaffScope' }
        notify: { type: boolean, description: Отправить сотруднику письмо, что доступ открыт }
    StaffMember:
      type: object
      required: [id, name, email, phone, role, scope, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        scope: { $ref: '#/components/schemas/StaffScope' }
        status: { $ref: '#/components/schemas/MemberStatus' }
    MemberPatch:
      type: object
      properties:
        role: { $ref: '#/components/schemas/StaffRole' }
        scope: { $ref: '#/components/schemas/StaffScope' }
        status: { $ref: '#/components/schemas/MemberStatus' }
    RolesMatrix:
      type: object
      description: Для каждой роли — список прав
      required: [dispatcher, engineer, executor, manager]
      properties:
        dispatcher: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        engineer: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        executor: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        manager: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    Error:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 'Например invalid_code, validation, rate_limited, forbidden, already_processed, last_manager' }
        message: { type: string }
        retryAfterSec: { type: integer }
        fields:
          type: object
          additionalProperties: { type: string }
